name: Antrag prüfen

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: antrag-${{ github.event.issue.number }}

jobs:
  pruefen:
    if: contains(github.event.issue.labels.*.name, 'vm-antrag') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v9
        env:
          FREIGABE: ${{ vars.FREIGABE || 'bauepete' }}
          VM_ERSTELLUNG: ${{ vars.VM_ERSTELLUNG || 'Master-Andi MWagnerOE5AOO' }}
        with:
          script: |
            const a = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/antrag.js`);
            const issue = context.payload.issue;
            const nr = issue.number;
            const en = a.isEnglish(issue);
            const t = (de, e) => (en ? e : de);
            const labels = a.labelNames(issue);
            const f = a.parseBody(issue.body);

            // Titel vereinheitlichen
            if (f.projektname) {
              const title = `[VM] ${f.projektname}`;
              if (issue.title !== title) {
                await github.rest.issues.update({ ...context.repo, issue_number: nr, title });
              }
            }

            // Änderung nach der Freigabe → Admins informieren (Teammitglieder = Proxmox-Zugriff!)
            const oldBody = context.payload.changes?.body?.from;
            if (context.payload.action === 'edited' && oldBody !== undefined && labels.some((l) => a.APPROVED_LABELS.includes(l))) {
              const diff = a.diffFields(a.parseBody(oldBody), f);
              if (diff.length) {
                const esc = (v) => (v ? String(v).replace(/\|/g, '\\|').replace(/\n+/g, '<br>') : '_leer_');
                const admins = [...new Set(`${process.env.FREIGABE} ${process.env.VM_ERSTELLUNG}`.split(/\s+/).filter(Boolean))].join(' ');
                await a.comment(github, context, nr,
                  `${a.mention(admins)} ⚠️ Antrag \`${f.projektname}\` wurde **nach der Freigabe** von @${context.actor} geändert:\n\n` +
                  '| Feld | vorher | nachher |\n|---|---|---|\n' +
                  diff.map((d) => `| ${d.name} | ${esc(d.old)} | ${esc(d.new)} |`).join('\n') +
                  (diff.some((d) => d.id === 'team') ? '\n\n**Teammitglieder geändert → Proxmox-Zugriff prüfen!**' : ''));
              }
            }

            // Felder anderer offener Anträge (Eindeutigkeit Projektname / DNS Name)
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, labels: a.LABEL.antrag, state: 'open', per_page: 100,
            });
            const others = open
              .filter((o) => o.number !== nr && !o.pull_request && !a.labelNames(o).includes(a.LABEL.abgelehnt))
              .map((o) => a.parseBody(o.body));

            const { errors, warnings } = a.validate(f, others, en, issue.user.login);
            const teacher = a.teacherLogin(f);
            if (teacher && teacher.toLowerCase() !== issue.user.login.toLowerCase() && !(await a.userExists(github, teacher))) {
              errors.push(t(
                `Betreuende Lehrkraft: GitHub-Benutzer \`${teacher}\` existiert nicht.`,
                `Supervising teacher: GitHub user \`${teacher}\` does not exist.`));
            }
            const warnText = warnings.length ? `\n\n${warnings.map((w) => `> ⚠️ ${w}`).join('\n>\n')}` : '';

            if (errors.length) {
              await a.addLabels(github, context, nr, [a.LABEL.ungueltig]);
              await a.upsertComment(github, context, nr, 'vm-antrag:pruefung',
                t('❌ **Der Antrag ist noch nicht gültig:**', '❌ **The request is not valid yet:**') + '\n\n' +
                errors.map((e) => `- ${e}`).join('\n') + '\n\n' +
                t('Bitte das Issue korrigieren (Menü `…` → _Edit_). Es wird automatisch neu geprüft.',
                  'Please correct the issue (menu `…` → _Edit_). It will be checked again automatically.') +
                warnText);
              return;
            }

            if (labels.includes(a.LABEL.ungueltig)) {
              await a.removeLabel(github, context, nr, a.LABEL.ungueltig);
            }
            await a.upsertComment(github, context, nr, 'vm-antrag:pruefung',
              t('✅ Der Antrag ist gültig.', '✅ The request is valid.') + warnText, true);

            // Erstmals gültig → zur Freigabe durch die betreuende Lehrkraft
            const askTeacher = (intro) =>
              `${intro} – betreuende Lehrkraft: @${teacher}. Bitte prüfen und mit einem Kommentar \`/freigeben\` zustimmen ` +
              '(oder `/ablehnen <Begründung>`). Danach gibt die AV frei.';
            if (!labels.some((l) => a.STATUS_LABELS.includes(l))) {
              await a.addLabels(github, context, nr, [a.LABEL.neu]);
              await a.comment(github, context, nr,
                askTeacher(`Neuer VM-Antrag \`${f.projektname}\``) + '\n\n' +
                t('Danke, euer Antrag ist eingegangen und wartet auf die Freigabe durch eure betreuende Lehrkraft.',
                  'Thank you, your request has been received and is waiting for approval by your supervising teacher.') +
                warnText);
            } else if (labels.includes(a.LABEL.neu) && oldBody !== undefined &&
                       a.teacherLogin(a.parseBody(oldBody)).toLowerCase() !== teacher.toLowerCase()) {
              // Lehrkraft vor der Freigabe geändert → neue Lehrkraft benachrichtigen
              await a.comment(github, context, nr, askTeacher(`Lehrkraft im VM-Antrag \`${f.projektname}\` geändert`));
            }
