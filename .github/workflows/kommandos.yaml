name: Kommandos

# Kommentar-Kommandos für Admins (Rolle Triage oder höher):
#   /ip <adresse>           IP eintragen (nur bei status: freigegeben)
#   /ablehnen <begründung>  Antrag ablehnen und schließen

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: antrag-${{ github.event.issue.number }}

jobs:
  kommando:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'vm-antrag') &&
      (startsWith(github.event.comment.body, '/ip') || startsWith(github.event.comment.body, '/ablehnen'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v9
        env:
          IP_VERGABE: ${{ vars.IP_VERGABE || 'htl-leonding' }}
          VM_ERSTELLUNG: ${{ vars.VM_ERSTELLUNG || 'MWagnerOE5AOO Master-Andi' }}
        with:
          script: |
            const a = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/antrag.js`);
            const issue = context.payload.issue;
            const c = context.payload.comment;
            const nr = issue.number;
            const labels = a.labelNames(issue);
            const react = (content) => github.rest.reactions.createForIssueComment({ ...context.repo, comment_id: c.id, content });
            const reply = async (msg) => { await react('confused'); await a.comment(github, context, nr, `@${c.user.login} ${msg}`); };

            const text = c.body.trim();
            const cmd = text.match(/^\/(ip|ablehnen)(?=\s|$)/)?.[1];
            if (!cmd) return;

            if (!(await a.hasTriage(github, context, c.user.login))) {
              core.info(`${c.user.login} darf keine Kommandos ausführen – ignoriert.`);
              return;
            }

            if (cmd === 'ip') {
              if (!labels.includes(a.LABEL.freigegeben)) {
                return reply(`\`/ip\` geht nur bei Label \`${a.LABEL.freigegeben}\`.`);
              }
              const m = text.split('\n')[0].match(/^\/ip\s+(\S+)\s*$/);
              if (!m || !a.isIPv4(m[1])) {
                return reply('Format: `/ip 10.x.x.x` (eine gültige IPv4-Adresse).');
              }
              const ip = m[1];
              const f = a.parseBody(issue.body);

              await a.removeLabel(github, context, nr, a.LABEL.freigegeben);
              await a.addLabels(github, context, nr, [a.LABEL.ipVergeben]);
              await react('+1');
              await a.comment(github, context, nr,
                `${a.mention(process.env.VM_ERSTELLUNG)} Bitte VM anlegen und danach Label \`${a.LABEL.erstellt}\` setzen.\n\n` +
                a.summary(f, ip) + '\n\n---\n\n' +
                (a.isEnglish(issue) ? `IP address of your VM: \`${ip}\`. The VM will be created next.`
                                    : `IP-Adresse eurer VM: \`${ip}\`. Als Nächstes wird die VM angelegt.`));
            }

            if (cmd === 'ablehnen') {
              if (labels.includes(a.LABEL.abgelehnt)) {
                return reply('Der Antrag ist bereits abgelehnt.');
              }
              const reason = text.replace(/^\/ablehnen/, '').trim();
              if (!reason) {
                return reply('Bitte eine Begründung angeben: `/ablehnen <Begründung>`');
              }
              await react('+1');
              await a.reject(github, context, issue, c.user.login, reason, process.env.IP_VERGABE);
            }
